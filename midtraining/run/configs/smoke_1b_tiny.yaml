# =============================================================================
# smoke_1b_tiny.yaml — 20-step pipeline validation run (NOT a paper experiment).
#
# Purpose: validate env + tokenized data + checkpointing + HF export end to end
# in a few minutes before launching any real run.
#
# Data: expects a tiny tokenized dataset at
#   midtraining/data/tokenized/SmokeTiny
# Create it with:
#   python prepare_data.py --datasets MegaMathWebPro --max-samples-per-dataset 2000 \
#       --output-root ../../data/smoke_jsonl
#   JSONL_ROOT=../../data/smoke_jsonl TOKENIZED_ROOT=../../data/tokenized \
#       bash tokenize_data.sh --datasets MegaMathWebPro
#   mv ../../data/tokenized/MegaMathWebPro ../../data/tokenized/SmokeTiny
# (or just point dataset_folder at any single tokenized dataset you have.)
# =============================================================================
checkpoints:
  checkpoint_interval: 10
  checkpoints_path: /hdd2/xiaolirui/OctoThinker/outputs/midtraining/smoke_1b_tiny/checkpoints
  checkpoints_path_is_shared_file_system: false
  resume_checkpoint_path: null
  save_initial_state: false
  save_final_state: true           # gives you something to test the HF export on

data_stages:
- name: Smoke test
  start_training_step: 1
  data:
    seed: 42
    num_loading_workers: 1
    dataset:
      dataset_folder:
      - /hdd2/xiaolirui/OctoThinker/midtraining/data/tokenized/SmokeTiny
      dataset_weights:
      - 1.0

general:
  benchmark_csv_path: null
  consumed_train_samples: null
  ignore_sanity_checks: true
  project: octothinker-midtraining
  run: smoke_1b_tiny
  seed: 42
  step: null

lighteval: null

logging:
  iteration_step_info_interval: 1
  log_level: info
  log_level_replica: info

model:
  ddp_bucket_cap_mb: 25
  dtype: bfloat16
  init_method:
    path: /hdd2/xiaolirui/OctoThinker/outputs/midtraining/converted/Llama-3.2-1B-Base-nanotron
  make_vocab_size_divisible_by: 1
  model_config:
    bos_token_id: 128000
    eos_token_id: 128001
    hidden_act: silu
    hidden_size: 2048
    initializer_range: 0.02
    intermediate_size: 8192
    is_llama_config: true
    max_position_embeddings: 8192
    num_attention_heads: 32
    num_hidden_layers: 16
    num_key_value_heads: 8
    pad_token_id: null
    pretraining_tp: 1
    rms_norm_eps: 1.0e-05
    rope_interleaved: false
    rope_scaling: null
    rope_theta: 500000.0
    tie_word_embeddings: true
    use_cache: true
    vocab_size: 128256
optimizer:
  accumulate_grad_in_fp32: false  # smoke only: bf16 grad accumulation saves 12GB (real runs: true)
  clip_grad: 1.0
  learning_rate_scheduler:
    learning_rate: 3.0e-05
    lr_warmup_steps: 0
    lr_warmup_style: linear
    lr_decay_style: cosine
    lr_decay_starting_step: null
    lr_decay_steps: null
    min_decay_lr: 3.0e-06
  optimizer_factory:
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    name: adamW
    torch_adam_is_fused: true
  weight_decay: 0.1
  zero_stage: 1                   # ZeRO-1: shard AdamW states across dp

parallelism:
  dp: 2
  expert_parallel_size: 1
  pp: 1
  pp_engine: 1f1b
  tp: 1
  recompute_layer: true           # activation checkpointing (fits 40GB)
  tp_linear_async_communication: true
  tp_mode: REDUCE_SCATTER

profiler: null

tokenizer:
  tokenizer_max_length: null
  tokenizer_name_or_path: /hdd2/xiaolirui/OctoThinker/models/Llama-3.2-3B-Base
  tokenizer_revision: null

tokens:
  batch_accumulation_per_replica: 4
  limit_test_batches: 0
  limit_val_batches: 0
  micro_batch_size: 4
  sequence_length: 4096
  train_steps: 20
  val_check_interval: -1
