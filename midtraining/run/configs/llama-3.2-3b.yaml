checkpoints:
  checkpoint_interval: 5000
  checkpoints_path: /hdd2/xiaolirui/OctoThinker/outputs/midtraining/llama-3.2-3b/checkpoints
  checkpoints_path_is_shared_file_system: false
  resume_checkpoint_path: null
  save_initial_state: false
  save_final_state: true
data_stages:
- name: Stage 1 (constant LR)
  start_training_step: 1
  data:
    seed: 42
    num_loading_workers: 1
    dataset:
      dataset_folder:
      - /hdd2/xiaolirui/OctoThinker/midtraining/data/tokenized/MegaMathWebProMax
      dataset_weights:
      - 1.0
general:
  benchmark_csv_path: null
  consumed_train_samples: null
  ignore_sanity_checks: true
  project: octothinker-midtraining
  run: llama-3.2-3b
  seed: 42
  step: null
lighteval: null
logging:
  iteration_step_info_interval: 1
  log_level: info
  log_level_replica: info
model:
  ddp_bucket_cap_mb: 25
  dtype: bfloat16
  init_method:
    path: /hdd2/xiaolirui/OctoThinker/outputs/midtraining/converted/Llama-3.2-3B-Base-nanotron
  make_vocab_size_divisible_by: 1
  model_config:
    bos_token_id: 128000
    eos_token_id: 128001
    hidden_act: silu
    hidden_size: 3072
    initializer_range: 0.02
    intermediate_size: 8192
    is_llama_config: true
    max_position_embeddings: 8192
    num_attention_heads: 24
    num_hidden_layers: 28
    num_key_value_heads: 8
    pad_token_id: null
    pretraining_tp: 1
    rms_norm_eps: 1.0e-05
    rope_interleaved: false
    rope_scaling: null
    rope_theta: 500000.0
    tie_word_embeddings: true
    use_cache: true
    vocab_size: 128256
optimizer:
  accumulate_grad_in_fp32: false
  clip_grad: 1.0
  learning_rate_scheduler:
    learning_rate: 2.0e-05
    lr_warmup_steps: 0
    lr_warmup_style: linear
    lr_decay_style: cosine
    lr_decay_starting_step: null
    lr_decay_steps: null
    min_decay_lr: 2.0e-05
  optimizer_factory:
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    name: adamW
    torch_adam_is_fused: true
  weight_decay: 0.1
  zero_stage: 1
parallelism:
  dp: 6
  expert_parallel_size: 1
  pp: 1
  pp_engine: 1f1b
  tp: 1
  tp_linear_async_communication: true
  tp_mode: REDUCE_SCATTER
  recompute_layer: true
profiler: null
tokenizer:
  tokenizer_max_length: null
  tokenizer_name_or_path: /hdd2/xiaolirui/OctoThinker/models/Llama-3.2-3B-Base
  tokenizer_revision: null
tokens:
  batch_accumulation_per_replica: 44
  limit_test_batches: 0
  limit_val_batches: 0
  micro_batch_size: 2
  sequence_length: 8192
  train_steps: 50000
  val_check_interval: -1
